<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcasting - {{ room_id }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <h1>Live: {{ room_id }}</h1>
    </header>

    <main>
        <section class="glass-panel" style="text-align: center;">
            <div class="status-badge" id="statusBadge">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Connecting...</span>
            </div>
            
            <div class="visualizer-container" id="visualizer">
                <!-- Bars will be generated by JS -->
            </div>

            <button class="btn btn-danger" id="stopBtn" onclick="stopBroadcast()">STOP BROADCAST</button>
            <a href="/" class="btn" style="background: rgba(255,255,255,0.1); margin-top: 1rem; color: white;">Back to Lobby</a>
        </section>
    </main>

    <script>
        // Pass server variables to JS
        const ROOM_ID = "{{ room_id }}";
    </script>
    <script src="/static/js/broadcast.js"></script>
</body>
</html>
